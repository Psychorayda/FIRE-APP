name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Configure git to use HTTPS instead of SSH
        run: "git config --global url.\"https://github.com/\".insteadOf git@github.com:"

      - name: Install dependencies
        # --no-frozen-lockfile: 升级阶段 lockfile 未同步更新，临时允许 CI 解析新版本
        # 合并后需本地 pnpm install 更新 pnpm-lock.yaml 并恢复 --frozen-lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Run tests (gate)
        run: pnpm test:all

      - name: Build app
        run: pnpm --filter @fire-app/desktop build

      - name: Strip workspace dep before packaging
        run: |
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete pkg.dependencies['@fire-app/shared'];
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Removed @fire-app/shared from dependencies (already bundled into out/)');
          "

      - name: Package .exe
        run: pnpm --filter @fire-app/desktop exec electron-builder --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fire-app-windows
          path: release/*.exe

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.exe
          generate_release_notes: true
