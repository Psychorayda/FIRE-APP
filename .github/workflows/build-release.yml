name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# electron-builder --publish always 需要写 release 权限
# 默认 GITHUB_TOKEN 只读，需显式声明 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，确保 git tag 能推送

      - name: Setup Node 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Configure git to use HTTPS instead of SSH
        run: "git config --global url.\"https://github.com/\".insteadOf git@github.com:"

      - name: Install dependencies
        # --no-frozen-lockfile: 升级阶段 lockfile 未同步更新，临时允许 CI 解析新版本
        # 合并后需本地 pnpm install 更新 pnpm-lock.yaml 并恢复 --frozen-lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate pre-release version
        shell: bash
        run: |
          RUN_NUM=${{ github.run_number }}
          # 0.1.1-dev.N：始终 > 本地 package.json 的 0.1.0，确保 electron-updater 判定为"有更新"
          # （allowDowngrade=false，0.0.0-dev.x < 0.1.0 会导致 UpdateDialog 不弹）
          # 仅用 run_number 不带日期，避免 tag 含过多点号导致 GitHub release 422
          VERSION="0.1.1-dev.${RUN_NUM}"
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Generated version: ${VERSION}"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Run tests (gate)
        run: pnpm test:all

      - name: Build app
        run: pnpm --filter @fire-app/desktop build

      - name: Strip workspace dep before packaging
        run: |
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete pkg.dependencies['@fire-app/shared'];
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Removed @fire-app/shared from dependencies (already bundled into out/)');
          "

      - name: Package .exe (no auto-publish)
        # electron-builder --publish never：只打包，不调用 GitHub API
        # release 由下方 gh CLI 显式创建，避免 electron-builder 26 的 tag 422 问题
        run: pnpm --filter @fire-app/desktop exec electron-builder --config electron-builder.yml --publish never

      - name: Create GitHub release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.version }}
        run: |
          # 显式创建 git tag + release（gh CLI 兼容性更好）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          # 创建 prerelease 并上传所有 .exe 和 latest.yml
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${VERSION}" \
            --notes "Pre-release build ${VERSION}" \
            --prerelease \
            release/*.exe release/latest.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fire-app-windows
          path: release/*.exe
