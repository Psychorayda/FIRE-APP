name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Configure git to use HTTPS instead of SSH
        run: "git config --global url.\"https://github.com/\".insteadOf git@github.com:"

      - name: Install dependencies
        # --no-frozen-lockfile: 升级阶段 lockfile 未同步更新，临时允许 CI 解析新版本
        # 合并后需本地 pnpm install 更新 pnpm-lock.yaml 并恢复 --frozen-lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate pre-release version
        shell: bash
        run: |
          DATE=$(date -u +%Y%m%d)
          RUN_NUM=${{ github.run_number }}
          # 0.1.1-dev.x：始终 > 本地 package.json 的 0.1.0，确保 electron-updater 判定为"有更新"
          # （allowDowngrade=false，0.0.0-dev.x < 0.1.0 会导致 UpdateDialog 不弹）
          VERSION="0.1.1-dev.${DATE}.${RUN_NUM}"
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Generated version: ${VERSION}"

      - name: Run tests (gate)
        run: pnpm test:all

      - name: Build app
        run: pnpm --filter @fire-app/desktop build

      - name: Strip workspace dep before packaging
        run: |
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete pkg.dependencies['@fire-app/shared'];
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Removed @fire-app/shared from dependencies (already bundled into out/)');
          "

      - name: Package .exe and publish to GitHub Releases
        run: pnpm --filter @fire-app/desktop exec electron-builder --config electron-builder.yml --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fire-app-windows
          path: release/*.exe
