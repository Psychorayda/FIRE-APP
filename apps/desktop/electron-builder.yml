# electron-builder 打包配置 / Packaging config
# 使用：pnpm --filter @fire-app/desktop dist
# CI：electron-builder --config electron-builder.yml

appId: com.fireapp.desktop
productName: FIRE App

# 统一产物命名：硬编码 "FIRE-App"（不用 ${productName}，因为它含空格 "FIRE App"，
# electron-builder 生成 exe 时会把空格替换成点号 → FIRE.App.Setup.exe，
# 但生成 latest.yml 时用连字符 → FIRE-App-Setup.exe，导致 electron-updater 下载 404）
# Hardcode name to avoid space→dot vs space→hyphen mismatch between exe and latest.yml
artifactName: FIRE-App-${version}-${arch}.${ext}

# 发布到 GitHub Releases（electron-updater 自动更新源）
# CI 每次 push 到 main 会自动生成预发布版本号并上传
publish:
  provider: github
  owner: Psychorayda
  repo: FIRE-APP
  releaseType: prerelease

directories:
  output: ../../release    # 产物输出到项目根 release/
  buildResources: build     # 图标等资源目录（apps/desktop/build/）

# 打包文件：electron-vite build 产物 + package.json
# node_modules 依赖由 electron-builder 根据 package.json dependencies 自动处理
# @fire-app/shared 已 inline 打包进 out/，CI 打包前会从 dependencies 移除
files:
  - out/**/*
  - package.json

# asar 打包，但原生模块解包（better-sqlite3 的 .node 必须能被 require）
asar: true
asarUnpack:
  - "**/better-sqlite3/**"
  - "**/*.node"

# Windows 目标
win:
  target:
    - target: nsis        # 安装包（带向导）
      arch: [x64]
    - target: portable    # 免安装版（解压即用）
      arch: [x64]
  # icon: build/icon.ico  # 暂用默认，后续补图标

# nsis 安装包配置
nsis:
  artifactName: FIRE-App-Setup-${version}.${ext}  # 安装包命名（与顶层 artifactName 风格一致）
  oneClick: false                           # 非一键安装，有向导
  perMachine: false                         # 当前用户安装（无需管理员）
  allowToChangeInstallationDirectory: true  # 允许选安装路径
  createDesktopShortcut: true
  createStartMenuShortcut: true
